[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sysforge-backend"
version = "1.0.0"
description = "SysForge — Intelligent Integrated System Programming Toolchain (backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.0",
    "anyio==4.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "engine*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Show test names, short traceback, no warnings noise
addopts = "-v --tb=short -p no:warnings"

# ---------------------------------------------------------------------------
# ruff (linting — optional, zero config needed to run)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
